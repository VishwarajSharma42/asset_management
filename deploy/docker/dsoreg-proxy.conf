# included by the locations that reach the application (same rules as deploy/dsoreg-proxy.conf)
set $dsoreg_upstream http://backend:8000;
proxy_pass $dsoreg_upstream;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;      # overwritten, not appended: clients cannot spoof it
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Connection "";
proxy_read_timeout 40s;
proxy_connect_timeout 5s;
proxy_buffering on;

# /etc/nginx/sites-available/dsoreg  — TLS front door for the DSO Asset Register.
# nginx terminates TLS, serves the static front end and images directly, and proxies /api and
# /health to gunicorn on a unix socket. It rate-limits crudely; the application's own
# database-backed limiter is the precise one.

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=scan:10m rate=40r/m;

upstream dsoreg { server unix:/run/dsoreg/gunicorn.sock fail_timeout=0; }

server {
    listen 80;
    server_name assets.college.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name assets.college.example;                         # = PUBLIC_HOST. It is written on every tag.

    ssl_certificate     /etc/letsencrypt/live/assets.college.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assets.college.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 4m;                                   # enrolment bodies carry a <=2 MB photo
    client_body_timeout 15s;
    keepalive_timeout 30s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    root /srv/dsoreg/frontend;

    # never serve dotfiles, VCS metadata or environment files
    location ~ /\.(?!well-known) { deny all; }

    location = /c        { default_type text/html; try_files /scan.html =404; limit_req zone=scan burst=20 nodelay; }
    location = /         { return 302 /app/; }
    location /app/       { try_files $uri $uri/ /app/index.html; }
    location /css/       { expires 1h; }
    location /js/        { expires 1h; }

    # images are named by their own SHA-256, so they can be cached forever
    location /media/ {
        alias /var/lib/dsoreg/media/;
        types { image/jpeg jpg; }
        default_type application/octet-stream;
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'" always;
    }

    location = /api/v1/auth/login {
        limit_req zone=login burst=4 nodelay;
        include /etc/nginx/dsoreg-proxy.conf;
    }
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/dsoreg-proxy.conf;
    }
    location = /health { include /etc/nginx/dsoreg-proxy.conf; }
}
